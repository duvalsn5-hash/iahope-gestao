# Compila o app Flutter de graça no GitHub Actions (não precisa ter Flutter no PC):
#   • a cada push: analisa, testa e gera Web + APK + Windows (aba Actions → artefatos)
#   • branch main: publica o app Web no GitHub Pages
#   • tag v*  (ex.: v1.0.0): cria uma Release com o APK e o .zip do Windows
#
# Configure em Settings → Secrets and variables → Actions → Variables:
#   API_URL = https://iahope-gestao-api.onrender.com   (URL da sua API)
# E em Settings → Pages → Source: "GitHub Actions".
#
# Desenvolvido por Edivaldo.Nascimento - IaHope-Technology
name: App Flutter

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['app/**', '.github/workflows/app.yml']
  workflow_dispatch:

# Uma publicação por vez: um push novo cancela a compilação anterior ainda em andamento
concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # criar Release
  pages: write
  id-token: write

env:
  API_URL: ${{ vars.API_URL || 'http://localhost:3000' }}

defaults:
  run:
    working-directory: app

jobs:
  check:
    name: Analisar e testar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: bash tool/setup_platforms.sh
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

  web:
    name: Web
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: bash tool/setup_platforms.sh && flutter pub get
      # GitHub Pages publica em /<nome-do-repositorio>/
      - run: >
          flutter build web --release
          --dart-define=API_URL=${{ env.API_URL }}
          --base-href "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v3
        with: { path: app/build/web }

  deploy-web:
    name: Publicar no GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    name: Android APK
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: bash tool/setup_platforms.sh && flutter pub get
      - run: flutter build apk --release --dart-define=API_URL=${{ env.API_URL }}
      - run: mv build/app/outputs/flutter-apk/app-release.apk build/iahope-gestao.apk
      - uses: actions/upload-artifact@v4
        with: { name: iahope-gestao-android, path: app/build/iahope-gestao.apk }

  windows:
    name: Windows
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: bash tool/setup_platforms.sh
        shell: bash
      - run: flutter pub get
      - run: flutter build windows --release --dart-define=API_URL=${{ env.API_URL }}
      - run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/iahope-gestao-windows.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with: { name: iahope-gestao-windows, path: app/build/iahope-gestao-windows.zip }

  release:
    name: Release (tag v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: . } }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            IaHope Gestão ${{ github.ref_name }}
            • Android: iahope-gestao.apk
            • Windows: descompacte iahope-gestao-windows.zip e abra iahope_gestao.exe

            Desenvolvido por Edivaldo.Nascimento - IaHope-Technology
